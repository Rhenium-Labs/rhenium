[package]
name = "rhenium"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "AI-powered moderation bot for Discord."

[dependencies]

# Discord
poise = "0.6"
serenity = { version = "0.12", default-features = false, features = [
    "gateway",
    "model",
    "cache",
    "http",
    "rustls_backend",
    "builder",
    "client",
    "collector",
] }

# Database
sea-orm = { version = "1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-json",
] }

# REST API
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# KV Store (LMDB)
heed = "0.20"

# Error tracking
sentry = { version = "0.35", features = ["tracing"] }

# OpenAI
async-openai = "0.26"

# Media processing
image = "0.25"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
fancy-regex = "0.14"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json"] }
tokio-cron-scheduler = "0.13"
humantime = "2"
base64 = "0.22"
rand = "0.9"
dashmap = "6"
thiserror = "2"
anyhow = "1"
subtle = "2"
lru = "0.12"
scopeguard = "1"
urlencoding = "2.1.3"
rhai = "1.24.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
